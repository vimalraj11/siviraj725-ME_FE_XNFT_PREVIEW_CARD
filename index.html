<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Equilibrium NFT preview card">
  <title>NFT Preview Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="card__images">
      <img
        class="card__image"
        src="assets/image-equilibrium.jpg"
        alt="Equilibrium NFT artwork"
      >

      <div class="card__images-layer">
        <img src="assets/icon-view.svg" alt="" aria-hidden="true">
      </div>
    </div>

    <section class="card__content">
      <h1 class="card__title">
        <a href="#" aria-label="Equilibrium NFT number 3429">Equilibrium #3429</a>
      </h1>

      <p class="card__description">
        Our Equilibrium collection promotes balance and calm.
      </p>

      <div class="card__time">
        <div class="card__time-left">
          <img src="assets/icon-ethereum.svg" alt="" aria-hidden="true">
          <span>0.041 ETH</span>
        </div>

        <div class="card__time-right">
          <img src="assets/icon-clock.svg" alt="" aria-hidden="true">
          <span>3 days left.</span>
        </div>
      </div>

      <div class="card__creator">
        <img
          class="card__creator-image"
          src="assets/logo.jpeg"
          alt="Creator avatar"
        >
        <p>
          <span>Creation of</span>
          <a href="https://github.com/" target="_blank" rel="noopener noreferrer">Jules Wyvern</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio</a>.
    Coded by
    <a href="https://github.com/" target="_blank" rel="noopener noreferrer">Developer</a>.
  </footer>
</body>
</html>
